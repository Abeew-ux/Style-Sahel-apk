<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Sahel AKD Suivi</title>
<style>
:root{--bg:#0b0b0c;--card:#151517;--card2:#1d1d20;--line:#2b2b30;--gold:#d4a937;--gold2:#f1d27a;--txt:#f4efe3;--mut:#9a9486;--ok:#4cc38a;--bad:#e5645c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{min-height:100vh}
button,input{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.logo{width:36px;height:36px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-weight:700;font-size:20px;color:var(--gold2);font-family:Georgia,serif}
.btn{width:100%;border:0;border-radius:12px;padding:14px 16px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1405}
.btn:disabled{opacity:.6}
.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:6px 12px;color:var(--mut);cursor:pointer;font-size:13px;letter-spacing:.06em}
.lang button.on{background:var(--gold);color:#1a1405;font-weight:700}
/* connexion */
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 16px;max-width:400px;margin:0 auto}
.auth .top{display:flex;justify-content:flex-end;margin-bottom:18px}
.auth .logo{width:84px;height:84px;font-size:46px;margin:0 auto 14px}
.auth h1{margin:0;text-align:center;letter-spacing:.16em;color:var(--gold2);font-size:26px}
.auth .sub{text-align:center;color:var(--mut);margin:6px 0 24px}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
input[type=text],input[type=tel],input[type=password]{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;outline:none;font-size:17px}
input:focus{border-color:var(--gold)}
.codewrap{position:relative}
.codewrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--gold);padding:10px;cursor:pointer;font-size:14px}
.codewrap input{padding-right:84px}
.check{display:flex;align-items:center;gap:10px;margin:16px 0 4px;color:var(--mut);font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--gold)}
.err{display:none;margin-top:14px;color:var(--bad);font-size:14px;text-align:center}
.err.on{display:block}
.auth .btn{margin-top:18px}
/* tableau */
header{position:sticky;top:0;z-index:5;background:rgba(11,11,12,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{display:block;letter-spacing:.12em;color:var(--gold2);font-size:15px}
.hello{padding:20px 0 4px}
.hello h2{margin:0;font-size:22px}
.hello h2 span{color:var(--gold2)}
.hello p{margin:4px 0 0;color:var(--mut);font-size:13px}
.bar{display:flex;gap:8px;margin:14px 0 6px}
h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ref{font-weight:700;letter-spacing:.05em}
.badge{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.s-enregistre{color:#bbb;border-color:#444}
.s-pris_en_charge{color:#e0b84a;border-color:#6b5520}
.s-en_transit{color:var(--gold2);border-color:#7a6224}
.s-en_livraison{color:#ff9a4d;border-color:#7a3f18}
.s-livre{color:var(--ok);border-color:#1f5a40}
.s-annule{color:var(--bad);border-color:#5a2723}
.desc{margin:12px 0 4px;font-size:16px}
.route{display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--gold2)}
.route small{display:block;color:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.route .arrow{color:var(--mut);flex:none}
.steps{display:flex;gap:5px;margin:14px 0 6px}
.steps i{flex:1;height:6px;border-radius:3px;background:#2a2a2e}
.steps i.on{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.meta{color:var(--mut);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}
.meta b{color:var(--txt);font-weight:600}
.link{background:none;border:0;color:var(--gold);padding:10px 0 0;cursor:pointer;font-size:14px}
.tl{list-style:none;margin:14px 0 2px;padding:0 0 0 16px;border-left:2px solid #4a3d16}
.tl li{position:relative;padding:0 0 14px 14px}
.tl li:before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--gold)}
.tl li:last-child{padding-bottom:2px}
.tl small{display:block;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:40px 0}
.offline{display:none;background:#2a1d10;border:1px solid #7a3f18;color:#ffb27a;border-radius:10px;padding:8px 12px;font-size:13px;margin-top:12px}
.offline.on{display:block}
footer{color:var(--mut);font-size:12px;text-align:center;padding:26px 0 calc(26px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SB_URL = 'https://cetbspgxsqbaousqrara.supabase.co';
const SB_KEY = 'sb_publishable_jVfbOWScVx_C4fXI1D_srA_CONVraPa';

const T = {
  fr: {
    title: 'Suivi de livraison', tel: 'Numéro de téléphone', telph: 'ex : 90 12 34 56', code: 'Code',
    show: 'Afficher', hide: 'Masquer', remember: 'Rester connecté sur cet appareil', login: 'Se connecter',
    hello: 'Bonjour', refresh: 'Actualiser', logout: 'Déconnexion', current: 'En cours', done: 'Terminées',
    none: 'Aucune livraison pour le moment.', from: 'Départ', to: 'Destination', planned: 'Prévue le',
    price: 'Prix', history: 'Voir l’historique', hideHist: 'Masquer l’historique', ref: 'Réf.',
    bad: 'Numéro ou code incorrect.', blocked: 'Trop d’essais. Réessayez dans 15 minutes.',
    net: 'Connexion impossible. Vérifiez votre internet.', badTel: 'Numéro de téléphone invalide.',
    updated: 'Mis à jour à', offline: 'Pas de connexion : les informations affichées peuvent être anciennes.',
    st: { enregistre: 'Enregistré', pris_en_charge: 'Pris en charge', en_transit: 'En transit', en_livraison: 'En livraison', livre: 'Livré', annule: 'Annulé' }
  },
  ha: {
    title: 'Bin diddigin isar da kaya', tel: 'Lambar waya', telph: 'misali : 90 12 34 56', code: 'Lambar sirri',
    show: 'Nuna', hide: 'Ɓoye', remember: 'Ci gaba da zama a shiga a wannan wayar', login: 'Shiga',
    hello: 'Sannu', refresh: 'Sabunta', logout: 'Fita', current: 'Masu kan hanya', done: 'An kammala',
    none: 'Babu kaya a yanzu.', from: 'Daga', to: 'Zuwa', planned: 'Ranar da aka shirya',
    price: 'Farashi', history: 'Duba tarihi', hideHist: 'Ɓoye tarihi', ref: 'Lamba',
    bad: 'Lambar waya ko lambar sirri ba daidai ba ne.', blocked: 'Ƙoƙari ya yi yawa. Ka sake gwadawa bayan minti 15.',
    net: 'Ba a iya haɗawa. Duba intanet ɗinka.', badTel: 'Lambar waya ba ta da inganci.',
    updated: 'An sabunta da', offline: 'Babu intanet : abin da ke nuni zai iya zama tsoho.',
    st: { enregistre: 'An yi rajista', pris_en_charge: 'An karɓi kayan', en_transit: 'Kayan yana kan hanya', en_livraison: 'Ana kai maka kayan', livre: 'An kawo kayan', annule: 'An soke' }
  }
};
const STEPS = ['enregistre', 'pris_en_charge', 'en_transit', 'en_livraison', 'livre'];
const KEY_LANG = 'sahel_lang', KEY_SESSION = 'sahel_client';

const S = { lang: 'fr', tel: '', code: '', data: null, open: new Set(), showCode: false, offline: false, updatedAt: null, msg: '' };
let timer = null;

const $ = s => document.querySelector(s);
const t = k => T[S.lang][k];
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('fr-FR') : '';
const fmtDT = d => new Date(d).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
const fmtPrix = (p, d) => Number(p).toLocaleString('fr-FR') + ' ' + (d || 'FCFA');
const stLabel = s => T[S.lang].st[s] || s;

function store(op, key, val) {
  try {
    if (op === 'get') return localStorage.getItem(key);
    if (op === 'set') localStorage.setItem(key, val);
    if (op === 'del') localStorage.removeItem(key);
  } catch (e) { /* stockage indisponible : l'appli marche sans */ }
  return null;
}
function normTel(s) {
  let x = String(s || '').replace(/[\s\-.()]/g, '');
  if (x.startsWith('00')) x = '+' + x.slice(2);
  if (!x.startsWith('+') && /^\d{8}$/.test(x)) x = '+227' + x;
  return x;
}

async function rpc(tel, code) {
  const r = await fetch(SB_URL + '/rest/v1/rpc/sahel_client_suivi', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SB_KEY },
    body: JSON.stringify({ p_tel: tel, p_code: code })
  });
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}

/* ---------- Vues ---------- */
function langSwitch() {
  return `<div class="lang"><button data-a="lang" data-v="fr" class="${S.lang === 'fr' ? 'on' : ''}">FR</button><button data-a="lang" data-v="ha" class="${S.lang === 'ha' ? 'on' : ''}">HA</button></div>`;
}
function loginView() {
  return `<div class="auth">
    <div class="top">${langSwitch()}</div>
    <div class="logo">S</div><h1>SAHEL AKD</h1><p class="sub">${esc(t('title'))}</p>
    <form id="f" autocomplete="off">
      <label for="tel">${esc(t('tel'))}</label>
      <input id="tel" name="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="${esc(t('telph'))}" value="${esc(S.tel)}" required>
      <label for="code">${esc(t('code'))}</label>
      <div class="codewrap">
        <input id="code" name="code" type="${S.showCode ? 'text' : 'password'}" autocomplete="off" autocapitalize="off" required>
        <button type="button" data-a="showcode">${esc(S.showCode ? t('hide') : t('show'))}</button>
      </div>
      <label class="check"><input id="rem" type="checkbox"> ${esc(t('remember'))}</label>
      <div class="err ${S.msg ? 'on' : ''}" id="err" role="alert">${esc(S.msg)}</div>
      <button class="btn" id="go" type="submit">${esc(t('login'))}</button>
    </form>
  </div>`;
}
function livCard(l) {
  const annule = l.statut === 'annule';
  const idx = STEPS.indexOf(l.statut);
  const steps = annule ? '' : `<div class="steps" aria-hidden="true">${STEPS.map((_, i) => `<i class="${i <= idx ? 'on' : ''}"></i>`).join('')}</div>`;
  const hist = (l.historique || []).map(h => `<li><b>${esc(stLabel(h.statut))}</b><small>${fmtDT(h.created_at)}</small></li>`).join('');
  const open = S.open.has(l.reference);
  return `<article class="card">
    <div class="row"><span class="ref">${esc(t('ref'))} ${esc(l.reference)}</span><span class="badge s-${esc(l.statut)}">${esc(stLabel(l.statut))}</span></div>
    <p class="desc">${esc(l.description)}</p>
    <div class="route"><div><small>${esc(t('from'))}</small>${esc(l.depart)}</div><span class="arrow">→</span><div><small>${esc(t('to'))}</small>${esc(l.destination)}</div></div>
    ${steps}
    <div class="meta">
      ${l.date_prevue ? `<span>${esc(t('planned'))} <b>${fmtDate(l.date_prevue)}</b></span>` : ''}
      ${l.prix != null ? `<span>${esc(t('price'))} <b>${fmtPrix(l.prix, l.devise)}</b></span>` : ''}
    </div>
    ${hist ? `<button class="link" data-a="hist" data-ref="${esc(l.reference)}">${esc(open ? t('hideHist') : t('history'))}</button>${open ? `<ul class="tl">${hist}</ul>` : ''}` : ''}
  </article>`;
}
function dashView() {
  const L = S.data.livraisons || [];
  const cur = L.filter(l => l.statut !== 'livre' && l.statut !== 'annule');
  const done = L.filter(l => l.statut === 'livre' || l.statut === 'annule');
  const upd = S.updatedAt ? `${t('updated')} ${S.updatedAt.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}` : '';
  return `<header><div class="wrap"><div class="brand"><div class="logo">S</div><b>SAHEL AKD</b></div>${langSwitch()}</div></header>
  <main class="wrap">
    <div class="hello"><h2>${esc(t('hello'))} <span>${esc(S.data.nom)}</span></h2><p>${esc(upd)}</p></div>
    <div class="bar"><button class="ghost" data-a="refresh">${esc(t('refresh'))}</button><button class="ghost" data-a="logout">${esc(t('logout'))}</button></div>
    <div class="offline ${S.offline ? 'on' : ''}">${esc(t('offline'))}</div>
    ${L.length ? '' : `<div class="empty">${esc(t('none'))}</div>`}
    ${cur.length ? `<h3>${esc(t('current'))}</h3>${cur.map(livCard).join('')}` : ''}
    ${done.length ? `<h3>${esc(t('done'))}</h3>${done.map(livCard).join('')}` : ''}
    <footer>Sahel AKD</footer>
  </main>`;
}
function render() {
  document.documentElement.lang = S.lang === 'ha' ? 'ha' : 'fr';
  const keepTel = $('#tel') ? $('#tel').value : null;
  $('#app').innerHTML = S.data ? dashView() : loginView();
  if (!S.data && keepTel != null) $('#tel').value = keepTel;
}

/* ---------- Logique ---------- */
function logout(msg) {
  stopPoll();
  S.data = null; S.code = ''; S.open = new Set(); S.offline = false; S.msg = msg || '';
  store('del', KEY_SESSION);
  render();
}
function startPoll() {
  stopPoll();
  timer = setInterval(() => { if (!document.hidden) refresh(true); }, 30000);
}
function stopPoll() { if (timer) { clearInterval(timer); timer = null; } }

async function refresh(silent) {
  if (!S.data) return;
  try {
    const r = await rpc(S.tel, S.code);
    if (!r.ok) { logout(r.erreur === 'bloque' ? t('blocked') : t('bad')); return; }
    S.data = r; S.offline = false; S.updatedAt = new Date(); render();
  } catch (e) {
    S.offline = true; render();
  }
}
async function doLogin(tel, code, remember, auto) {
  const btn = $('#go');
  if (btn) btn.disabled = true;
  try {
    const r = await rpc(tel, code);
    if (!r.ok) {
      S.msg = r.erreur === 'bloque' ? t('blocked') : t('bad');
      store('del', KEY_SESSION);
      S.tel = tel; render(); return;
    }
    S.tel = tel; S.code = code; S.data = r; S.msg = ''; S.offline = false; S.updatedAt = new Date();
    if (remember) store('set', KEY_SESSION, JSON.stringify({ tel, code }));
    render(); startPoll();
  } catch (e) {
    if (!auto) { S.msg = t('net'); S.tel = tel; }
    render();
  }
}

document.addEventListener('submit', e => {
  e.preventDefault();
  const tel = normTel($('#tel').value);
  const code = $('#code').value.trim();
  if (!/^\+?\d{8,15}$/.test(tel)) { S.msg = t('badTel'); S.tel = $('#tel').value; render(); return; }
  doLogin(tel, code, $('#rem').checked, false);
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a;
  if (a === 'lang') {
    S.lang = el.dataset.v; store('set', KEY_LANG, S.lang);
    const tel = $('#tel') ? $('#tel').value : S.tel;
    S.tel = tel; if (!S.data) S.msg = '';
    render();
  }
  else if (a === 'showcode') {
    const tel = $('#tel').value, code = $('#code').value, rem = $('#rem').checked;
    S.showCode = !S.showCode; S.tel = tel; render();
    $('#code').value = code; $('#rem').checked = rem;
  }
  else if (a === 'logout') logout('');
  else if (a === 'refresh') refresh(false);
  else if (a === 'hist') {
    const r = el.dataset.ref;
    if (S.open.has(r)) S.open.delete(r); else S.open.add(r);
    render();
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.data) refresh(true); });

(function init() {
  const lg = store('get', KEY_LANG);
  if (lg === 'fr' || lg === 'ha') S.lang = lg;
  render();
  const raw = store('get', KEY_SESSION);
  if (raw) {
    try {
      const s = JSON.parse(raw);
      if (s && s.tel && s.code) doLogin(s.tel, s.code, true, true);
    } catch (e) { store('del', KEY_SESSION); }
  }
})();
</script>
</body>
</html>
