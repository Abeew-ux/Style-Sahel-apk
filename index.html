<style>
:root{
  --nuit:#06050b;--s1:#0f0d13;--s2:#17141c;--s3:#211d28;--line:#2a2531;
  --or:#d4a937;--or2:#f1d27a;--or3:#8a6a1f;--ivoire:#f3ecdd;--sable:#a9a08f;--bad:#e8675f;--ok:#52c48f;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--nuit);color:var(--ivoire);font-family:var(--sans);font-size:16px;line-height:1.35}
body{position:fixed;inset:0;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text}
#hd{flex:none;position:relative;z-index:15;background:rgba(6,5,11,.97)}
#sc{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:12px}
#sc.noscroll{overflow:hidden;padding-bottom:0;position:relative}
#sv{flex:1;min-height:0;display:none}
#sv.on{display:block}
#sv iframe{display:block;width:100%;height:100%;border:0;background:var(--nuit)}
#bt{flex:none;position:relative;z-index:20}
body.pdp #hd{position:absolute;left:0;right:0;top:0;background:none;pointer-events:none}
body.pdp #hd .rb{pointer-events:auto}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--or2);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
.pad{padding:0 12px}
svg{display:block}

/* en-tête collant : logo + recherche (comme Alibaba) */
.hd{padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:10px}
.hd .em{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--or3);object-fit:cover;background:#000}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--s2);border:1.5px solid var(--or);border-radius:999px;padding:0 6px 0 14px;height:40px}
.search svg{width:18px;height:18px;color:var(--or2);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:15px;height:100%}
.search input::placeholder{color:var(--sable)}
.search .go{flex:none;border:0;border-radius:999px;background:linear-gradient(135deg,#f6dc8e,#cfa032);color:#1a1405;font-weight:800;font-size:13px;padding:6px 12px}
.lg{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--s1);color:var(--or2);font-weight:800;font-size:12.5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none;background:rgba(6,5,11,.97)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:none;color:var(--sable);font-size:15px;padding:6px 4px;border-bottom:2.5px solid transparent;white-space:nowrap}
.chip.on{color:var(--or2);font-weight:700;border-bottom-color:var(--or2)}

/* bannières */
.ban{margin:0 12px 8px;border-radius:16px;overflow:hidden;position:relative}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.slides::-webkit-scrollbar{display:none}
.sl{flex:none;width:100%;scroll-snap-align:start;min-height:122px;padding:12px 16px 16px;display:flex;align-items:center;gap:12px;position:relative}
.sl.a{background:linear-gradient(120deg,#5a4513,#d4a937 120%)}
.sl.b{background:linear-gradient(120deg,#1d1a24,#8a6a1f 130%)}
.sl.c{background:linear-gradient(120deg,#2b2110,#b88f2a 130%)}
.sl .tx{flex:1;min-width:0}
.sl small{display:block;font-size:13px;color:#f6e7b8}
.sl h2{margin:2px 0 3px;font-size:22px;line-height:1.1;color:#fff4d0;font-weight:800}
.sl p{margin:0 0 8px;font-size:13px;color:#f3e3b0}
.sl .btn2{border:0;border-radius:999px;background:var(--nuit);color:var(--or2);font-weight:700;font-size:13.5px;padding:8px 16px}
.sl img.lo{flex:none;width:84px;height:84px;border-radius:16px;object-fit:cover;border:2px solid rgba(241,210,122,.7);background:#000}
.sl .big{flex:none;font-size:46px;font-weight:900;color:#fff4d0;line-height:1}
.dots{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.4)}
.dots i.on{width:16px;background:#fff}

/* catégories en grille d'icônes */

/* sections */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:20px 12px 10px}
.sec h2{margin:0;font-size:18px;font-weight:800}
.sec h2 i{font-style:normal;display:inline-block;width:4px;height:15px;background:var(--or);border-radius:2px;margin-right:8px;vertical-align:-2px}
.sec button{background:none;border:0;color:var(--or2);font-size:13.5px;padding:4px 0}
.hs{display:flex;gap:10px;overflow-x:auto;padding:0 12px 4px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs .p{flex:none;width:132px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}

/* carte produit */
.p{position:relative;background:var(--s1);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left}
.p .im{position:relative;aspect-ratio:1/1;background:linear-gradient(135deg,#3a2f12,#17141c)}
.p .im img.ph1{width:100%;height:100%;object-fit:cover;display:block}
.p .im .ph{position:absolute;inset:0;display:grid;place-items:center}
.p .im .ph img{width:44%;opacity:.5}
.tag{position:absolute;left:6px;top:6px;background:var(--or2);color:#1a1405;font-weight:800;font-size:11.5px;border-radius:6px;padding:2px 6px}
.rupture{position:absolute;right:6px;top:6px;background:rgba(6,5,11,.85);color:var(--sable);border:1px solid var(--line);font-size:11px;border-radius:6px;padding:2px 6px}
.p .tx{padding:8px 9px 10px;position:relative}
.p h3{margin:0;font-size:13.5px;font-weight:500;line-height:1.28;height:35px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pr{display:block;margin-top:6px}
.pr .l1{white-space:nowrap}
.pn{font-size:17px;font-weight:800;color:var(--or2)}
.pu{font-size:11.5px;color:var(--or2);font-weight:600}
.pr s{display:block;font-size:12px;color:var(--sable)}
.qa{position:absolute;right:7px;bottom:7px;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--or);background:rgba(6,5,11,.78);color:var(--or2);display:grid;place-items:center;padding:0}
.qa svg{width:17px;height:17px}
.qa:disabled{opacity:.35}
.empty{color:var(--sable);text-align:center;padding:34px 12px;border:1px dashed var(--line);border-radius:14px;margin:14px 12px}

/* page catégories : rail latéral */
#sc.noscroll{position:relative}
.cpw{position:absolute;top:0;bottom:0;left:0;right:0;margin:0 auto}
.cp{display:flex;align-items:stretch;height:100%}
.rail{flex:none;width:98px;height:100%;overflow-y:auto;background:var(--s1);border-right:1px solid var(--line);scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{display:block;width:100%;background:none;border:0;border-left:3px solid transparent;color:var(--sable);text-align:left;padding:14px 4px 14px 9px;font-size:12px;line-height:1.2;overflow-wrap:normal}
.rail button.on{color:var(--or2);font-weight:600;border-left-color:var(--or);background:var(--nuit)}
.rp{flex:1;min-width:0;height:100%;overflow-y:auto;overscroll-behavior:contain;padding-bottom:12px}
.sort{display:flex;gap:6px;overflow-x:auto;padding:10px 10px 6px;scrollbar-width:none}
.sort::-webkit-scrollbar{display:none}
.sort button{flex:none;border:1px solid var(--line);background:var(--s1);color:var(--sable);border-radius:999px;font-size:12.5px;padding:6px 12px}
.sort button.on{border-color:var(--or);color:var(--or2);background:rgba(212,169,55,.12);font-weight:700}
.rp .grid{padding:4px 10px 0}
.rp .cnt{padding:2px 12px 4px;font-size:12px;color:var(--sable)}

/* fiche produit */
.top{display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 0}
.top .g{display:flex;gap:8px;pointer-events:auto}
.rb{position:relative;width:38px;height:38px;border-radius:50%;border:0;background:rgba(6,5,11,.72);color:var(--ivoire);display:grid;place-items:center;padding:0;pointer-events:auto}
.rb svg{width:20px;height:20px}
.rb .n{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--or2);color:#1a1405;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 3px}
.gal{position:relative;aspect-ratio:1/1;background:linear-gradient(135deg,#3a2f12,#17141c)}
.gal img.m{width:100%;height:100%;object-fit:cover;display:block}
.gal .ph{position:absolute;inset:0;display:grid;place-items:center}
.gal .ph img{width:30%;opacity:.5}
.gal .ct{position:absolute;right:12px;bottom:12px;background:rgba(6,5,11,.75);border-radius:999px;font-size:12px;padding:3px 10px}
.pb{margin:0;padding:12px 14px;background:linear-gradient(120deg,#6b5115,#d4a937 120%);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pb .pn{font-size:28px;color:#fff4d0}
.pb .pu{font-size:14px;color:#fff4d0}
.pb s{color:#f3e3b0;font-size:14px}
.pb .off{margin-left:auto;background:var(--nuit);color:var(--or2);font-weight:800;font-size:13px;border-radius:7px;padding:3px 9px}
.box{background:var(--s1);border:1px solid var(--line);border-radius:14px;margin:10px 12px 0;padding:12px 14px}
.box h1{margin:0;font-size:19px;line-height:1.25;font-weight:700}
.box .sub{margin-top:6px;font-size:13px;color:var(--sable)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.row2:last-child{border-bottom:0;padding-bottom:0}
.row2:first-child{padding-top:0}
.row2 span:first-child{color:var(--sable);flex:none}
.row2 span:last-child{text-align:right}
.ok{color:var(--ok)}.no{color:var(--bad)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:36px;height:36px;background:var(--s2);border:0;font-size:19px;color:var(--or2)}
.qty span{min-width:36px;text-align:center;font-weight:700}
.box p.d{margin:0;color:#dcd5c5;white-space:pre-wrap;font-size:14.5px}
.buy{background:rgba(10,9,14,.97);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.buy .wrap{display:flex;gap:8px}
.b1,.b2{flex:1;height:48px;border-radius:999px;font-weight:800;font-size:14.5px;padding:0 8px}
.b1{border:1.5px solid var(--or);background:none;color:var(--or2)}
.b2{border:0;background:linear-gradient(135deg,#f6dc8e,#cfa032);color:#1a1405}
.buy button:disabled{opacity:.4}

/* panier */
.shop{display:flex;align-items:center;gap:8px;font-weight:700;margin:12px 12px 8px}
.shop svg{width:20px;height:20px;color:var(--or)}
.line{display:flex;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px;margin:0 12px 10px}
.line .th{flex:none;width:72px;height:72px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#3a2f12,#17141c)}
.line .th img{width:100%;height:100%;object-fit:cover;display:block}
.line .mid{flex:1;min-width:0}
.line .mid b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.line .mid .u{display:block;color:var(--or2);font-weight:800;margin-top:3px}
.line .qty button{width:32px;height:32px}
.line .qty span{min-width:30px}
.line .rm{background:none;border:0;color:var(--bad);font-size:12.5px;padding:6px 0 0}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:6px 14px 0;font-size:17px}
.total b{font-size:24px;color:var(--or2)}
.form{padding:0 12px}
label{display:block;font-size:13px;color:var(--sable);margin:14px 0 6px}
input[type=text],input[type=search]{-webkit-appearance:none}
.f{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:13px;outline:none;font-size:16px}
.f:focus{border-color:var(--or);box-shadow:0 0 0 3px rgba(212,169,55,.16)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:var(--s1);border-radius:12px;padding:12px 8px;font-size:14px;line-height:1.25}
.seg button.on{border-color:var(--or);background:rgba(212,169,55,.14);color:var(--or2);font-weight:700}
.btn{border:0;border-radius:999px;padding:14px 18px;font-weight:800;background:linear-gradient(135deg,#f6dc8e,#cfa032);color:#1a1405;font-size:16px;width:100%}
.lbtn{background:transparent;border:1px solid var(--line);border-radius:999px;padding:12px 16px;color:var(--ivoire);font-size:15px;width:100%}
.note{color:var(--sable);font-size:13px;margin:10px 0 0}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 12px 0}
.card h3{margin:0 0 6px;font-size:17px}
.card p{margin:0 0 10px;color:#dcd5c5;font-size:14.5px}
h2.page{margin:14px 12px 0;font-size:21px}

/* barre du bas */
nav{background:rgba(10,9,14,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:flex;height:60px}
nav button{position:relative;flex:1;background:none;border:0;color:var(--sable);font-size:11.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button.on{color:var(--or2);font-weight:700}
nav svg{width:24px;height:24px}
nav .n{position:absolute;top:5px;left:calc(50% + 5px);min-width:17px;height:17px;border-radius:9px;background:var(--or2);color:#1a1405;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;font-style:normal}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;background:var(--s3);border:1px solid var(--or);color:var(--ivoire);padding:10px 16px;border-radius:12px;max-width:90%;display:none;font-size:14px}
#toast.err{border-color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

`, fromSahel: 'Sahel AKD',\n    modeSaved: 'Votre choix est enregistré.', modeLate: 'Trop tard : le colis est déjà en livraison.', proof: 'Preuve de livraison', photo: 'Photo du colis',\n    st: { enregistre: 'Enregistré', pris_en_charge: 'Pris en charge', en_transit: 'En transit', en_livraison: 'En livraison', livre: 'Livré', annule: 'Annulé' }\n  },\n  ha: {\n    title: 'Bin diddigin isar da kaya', sub: 'Shiga da lambar wayarka da lambar sirri', tel: 'Lambar waya', telph: 'misali : 90 12 34 56', code: 'Lambar sirri',\n    show: 'Nuna', hide: 'Ɓoye', remember: 'Ci gaba da zama a shiga a wannan wayar', login: 'Shiga',\n    hello: 'Sannu', refresh: 'Sabunta', logout: 'Fita', current: 'Masu kan hanya', done: 'An kammala',\n    none: 'Babu kaya a yanzu. Zai bayyana a nan da zarar an yi masa rajista.', from: 'Daga', to: 'Zuwa', planned: 'Ranar da aka shirya',\n    price: 'Farashi', history: 'Duba tarihi', hideHist: 'Ɓoye tarihi', ref: 'Lamba',\n    bad: 'Lambar waya ko lambar sirri ba daidai ba ne.', blocked: 'Ƙoƙari ya yi yawa. Ka sake gwadawa bayan minti 15.',\n    net: 'Ba a iya haɗawa. Duba intanet ɗinka.', badTel: 'Lambar waya ba ta da inganci.',\n    updated: 'An sabunta da', offline: 'Babu intanet : abin da ke nuni zai iya zama tsoho.',\n    modeQ: 'Yaya kake so ka karɓi kayanka?', modeToChoose: 'Zaɓi : ', modeLivreur: 'Tare da mai kai kaya', modeRetrait: 'Zan zo in karɓa',\n    modeChosenLivreur: 'Zaɓinka : mai kai kaya zai kawo maka kayan.', modeChosenRetrait: 'Zaɓinka : za ka zo ka karɓi kayan da kanka.',\n    msgs: 'Saƙonni', noMsg: 'Babu saƙo a yanzu.', newMsg: 'Sabon saƙo', close: 'Rufe',\n    sonOn: 'An kunna sauti', sonOff: 'An kashe sauti', alertsAsk: 'Kunna sanarwa a wannan wayar', alertsHint: 'Za ka samu sanarwa da zarar saƙo ya zo (idan an buɗe manhajar).', alertsOn: 'An kunna sanarwa a wannan wayar.',\n    msgStatut: (ref, st) => `Kayanka ${ref} : ${st}`, fromSahel: 'Sahel AKD',\n    modeSaved: 'An adana zaɓinka.', modeLate: 'Ya makara : an riga an fara kai kayan.', proof: 'Hoton shaidar isarwa', photo: 'Hoton kayan',\n    st: { enregistre: 'An yi rajista', pris_en_charge: 'An karɓi kayan', en_transit: 'Kayan yana kan hanya', en_livraison: 'Ana kai maka kayan', livre: 'An kawo kayan', annule: 'An soke' }\n  }\n};\nconst STEPS = ['enregistre', 'pris_en_charge', 'en_transit', 'en_livraison', 'livre'];\nconst KEY_LANG = 'sahel_lang', KEY_SESSION = 'sahel_client', KEY_SON = 'sahel_son';\n\nconst S = { son: true, panel: false, known: new Set(), fresh: new Set(), busy: false, lang: 'fr', tel: '', code: '', data: null, open: new Set(), showCode: false, offline: false, updatedAt: null, msg: '' };\nlet timer = null;\n\nconst $ = s => document.querySelector(s);\nconst t = k => T[S.lang][k];\nconst esc = v => String(v == null ? '' : v).replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nconst fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('fr-FR') : '';\nconst fmtDT = d => new Date(d).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });\nconst fmtPrix = (p, d) => Number(p).toLocaleString('fr-FR') + ' ' + (d || 'FCFA');\nconst stLabel = s => T[S.lang].st[s] || s;\n\nfunction store(op, key, val) {\n  try {\n    if (op === 'get') return localStorage.getItem(key);\n    if (op === 'set') localStorage.setItem(key, val);\n    if (op === 'del') localStorage.removeItem(key);\n  } catch (e) { /* stockage indisponible : l'appli marche sans */ }\n  return null;\n}\nfunction normTel(s) {\n  let x = String(s || '').replace(/[\\s\\-.()]/g, '');\n  if (x.startsWith('00')) x = '+' + x.slice(2);\n  if (!x.startsWith('+') && /^\\d{8}$/.test(x)) x = '+227' + x;\n  return x;\n}\n\nasync function rpc(tel, code, fn, extra) {\n  const r = await fetch(SB_URL + '/rest/v1/rpc/' + (fn || 'sahel_client_suivi'), {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json', apikey: SB_KEY },\n    body: JSON.stringify(Object.assign({ p_tel: tel, p_code: code }, extra || {}))\n  });\n  if (!r.ok) throw new Error('http ' + r.status);\n  return r.json();\n}\n\n/* ---------- Vues ---------- */\nfunction langSwitch() {\n  return `<div class=\"lang\" role=\"group\" aria-label=\"Langue\"><button data-a=\"lang\" data-v=\"fr\" class=\"${S.lang === 'fr' ? 'on' : ''}\">FR<\/button><button data-a=\"lang\" data-v=\"ha\" class=\"${S.lang === 'ha' ? 'on' : ''}\">HA<\/button><\/div>`;\n}\nfunction loginView() {\n  const ico = {\n    truck: '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 6h12v10H2zM14 9h4l3 3v4h-7\"/><circle cx=\"7\" cy=\"17.500\" r=\"1.800\"/><circle cx=\"17\" cy=\"17.500\" r=\"1.800\"/><\/svg>',\n    phone: '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"7\" y=\"2.500\" width=\"10\" height=\"19\" rx=\"2.500\"/><path d=\"M11 18.500h2\"/><\/svg>',\n    lock: '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"10.500\" width=\"14\" height=\"10\" rx=\"2.500\"/><path d=\"M8.500 10.500V8a3.500 3.500 0 0 1 7 0v2.500\"/><\/svg>'\n  };\n  return `<div class=\"auth\">\n    <div class=\"top\">${langSwitch()}<\/div>\n    <div class=\"badge\" aria-hidden=\"true\">${ico.truck}<\/div>\n    <h1>${esc(t('title'))}<\/h1><p class=\"sub\">${esc(t('sub'))}<\/p>\n    <form id=\"f\" autocomplete=\"off\">\n      <label for=\"tel\">${esc(t('tel'))}<\/label>\n      <div class=\"field\">${ico.phone}<input id=\"tel\" name=\"tel\" type=\"tel\" inputmode=\"tel\" autocomplete=\"tel\" placeholder=\"${esc(t('telph'))}\" value=\"${esc(S.tel)}\" required><\/div>\n      <label for=\"code\">${esc(t('code'))}<\/label>\n      <div class=\"field codewrap\">${ico.lock}\n        <input id=\"code\" name=\"code\" type=\"${S.showCode ? 'text' : 'password'}\" autocomplete=\"off\" autocapitalize=\"off\" required>\n        <button type=\"button\" data-a=\"showcode\">${esc(S.showCode ? t('hide') : t('show'))}<\/button>\n      <\/div>\n      <label class=\"check\"><input id=\"rem\" type=\"checkbox\"> ${esc(t('remember'))}<\/label>\n      <div class=\"err ${S.msg ? 'on' : ''}\" id=\"err\" role=\"alert\">${esc(S.msg)}<\/div>\n      <button class=\"btn\" id=\"go\" type=\"submit\">${esc(t('login'))}<\/button>\n    <\/form>\n  <\/div>`;\n}\nlet toastTimer;\nfunction toast(msg, err) {\n  const el = $('#toast');\n  el.textContent = msg; el.className = err ? 'err' : ''; el.style.display = 'block';\n  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3600);\n}\nconst EARLY = ['enregistre', 'pris_en_charge', 'en_transit'];\nconst msgText = m => m.type === 'texte' ? (m.texte || '') : t('msgStatut')(m.reference || '', stLabel(m.statut));\nconst nonLus = () => (S.data && S.data.messages ? S.data.messages.filter(m => !m.lu).length : 0);\nlet audioCtx = null;\nfunction debloquerAudio() {\n  try {\n    if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }\n    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();\n  } catch (e) { /* sans gravité */ }\n}\n// Les navigateurs n'autorisent le son qu'après un premier appui de la personne\ndocument.addEventListener('pointerdown', debloquerAudio, { passive: true });\nfunction sonner() {\n  if (!S.son) return;\n  debloquerAudio();\n  const c = audioCtx;\n  if (!c || c.state !== 'running') return;\n  try {\n    [[880, 0], [1318.5, 0.16]].forEach(([f, d]) => {\n      const o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + d;\n      o.type = 'sine'; o.frequency.value = f;\n      g.gain.setValueAtTime(0.0001, t0);\n      g.gain.exponentialRampToValueAtTime(0.28, t0 + 0.02);\n      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);\n      o.connect(g); g.connect(c.destination);\n      o.start(t0); o.stop(t0 + 0.6);\n    });\n  } catch (e) { /* sans gravité */ }\n  try { if (navigator.vibrate) navigator.vibrate([120, 60, 120]); } catch (e) { /* sans gravité */ }\n}\nfunction badgeApp() {\n  const n = nonLus();\n  try { document.title = (n ? '(' + n + ') ' : '') + 'Sahel AKD Suivi'; } catch (e) { /* sans gravité */ }\n  try { if (navigator.setAppBadge) { n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } } catch (e) { /* sans gravité */ }\n}\nasync function alerte(m) {\n  if (!('Notification' in window) || Notification.permission !== 'granted') return;\n  const opts = { body: msgText(m), icon: 'sahel-icon-192.png', badge: 'sahel-icon-192.png', tag: 'sahel-' + m.id, vibrate: [120, 60, 120], silent: false };\n  try {\n    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();\n    if (reg && reg.showNotification) { await reg.showNotification('Sahel AKD', opts); return; }\n  } catch (e) { /* on essaie la méthode simple */ }\n  try { new Notification('Sahel AKD', opts); } catch (e) { /* sans gravité */ }\n}\nfunction reperer(r, premier) {\n  const nouveaux = (r.messages || []).filter(m => !m.lu && !S.known.has(m.id));\n  (r.messages || []).forEach(m => S.known.add(m.id));\n  if (premier || !nouveaux.length) return;\n  toast(t('newMsg') + ' : ' + msgText(nouveaux[0]));\n  sonner();\n  nouveaux.slice(0, 3).forEach(alerte);\n}\nasync function marquerLus() {\n  if (!S.data || !S.data.messages) return;\n  S.fresh = new Set(S.data.messages.filter(m => !m.lu).map(m => m.id));\n  if (!S.fresh.size) return;\n  S.data.messages = S.data.messages.map(m => Object.assign({}, m, { lu: true }));\n  try { await rpc(S.tel, S.code, 'sahel_client_lire_messages'); } catch (e) { /* sera refait à la prochaine ouverture */ }\n}\nfunction panelView() {\n  if (!S.panel || !S.data) return '';\n  const L = S.data.messages || [];\n  const perm = 'Notification' in window ? Notification.permission : 'unsupported';\n  const alertes = perm === 'default' ? `<div class=\"alerts\">${esc(t('alertsHint'))}<button class=\"line-btn\" data-a=\"alerts\">${esc(t('alertsAsk'))}<\/button><\/div>`\n    : perm === 'granted' ? `<p class=\"alerts\">${esc(t('alertsOn'))}<\/p>` : '';\n  const items = L.map(m => `<li class=\"${m.type === 'statut' ? 'st-' + esc(m.statut) : ''} ${S.fresh.has(m.id) ? 'new' : ''}\"><p class=\"from\">${esc(t('fromSahel'))}<\/p><p>${esc(msgText(m))}<\/p><small>${fmtDT(m.created_at)}<\/small><\/li>`).join('');\n  return `<div class=\"backdrop\" data-a=\"panel-close\"><div class=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-label=\"${esc(t('msgs'))}\">\n    <h3>${esc(t('msgs'))}<\/h3>\n    <button class=\"line-btn sonbtn ${S.son ? 'on' : ''}\" data-a=\"son\" role=\"switch\" aria-checked=\"${S.son}\"><i><\/i>${esc(S.son ? t('sonOn') : t('sonOff'))}<\/button>${alertes}\n    ${L.length ? `<ul class=\"msgs\">${items}<\/ul>` : `<div class=\"empty\">${esc(t('noMsg'))}<\/div>`}\n    <button class=\"line-btn\" data-a=\"panel-close\">${esc(t('close'))}<\/button><\/div><\/div>`;\n}\nfunction modeBlock(l) {\n  if (EARLY.includes(l.statut)) {\n    const m = l.mode_livraison;\n    return `<div class=\"choice ${m ? '' : 'todo'}\"><p>${m ? '' : `<b>${esc(t('modeToChoose'))}<\/b>`}${esc(t('modeQ'))}<\/p>\n      <div class=\"opts\">\n        <button class=\"opt ${m === 'livreur' ? 'on' : ''}\" data-a=\"mode\" data-ref=\"${esc(l.reference)}\" data-v=\"livreur\" aria-pressed=\"${m === 'livreur'}\" ${S.busy ? 'disabled' : ''}>${esc(t('modeLivreur'))}<\/button>\n        <button class=\"opt ${m === 'retrait' ? 'on' : ''}\" data-a=\"mode\" data-ref=\"${esc(l.reference)}\" data-v=\"retrait\" aria-pressed=\"${m === 'retrait'}\" ${S.busy ? 'disabled' : ''}>${esc(t('modeRetrait'))}<\/button>\n      <\/div><\/div>`;\n  }\n  if (l.statut !== 'annule' && l.mode_livraison) {\n    return `<p class=\"chosen\">${esc(t(l.mode_livraison === 'livreur' ? 'modeChosenLivreur' : 'modeChosenRetrait'))}<\/p>`;\n  }\n  return '';\n}\nfunction livCard(l) {\n  const annule = l.statut === 'annule';\n  const idx = STEPS.indexOf(l.statut);\n  const steps = annule ? '' : `<div class=\"steps\" aria-hidden=\"true\">${STEPS.map((_, i) => `<i class=\"${i <= idx ? 'on' : ''}\"><\/i>`).join('')}<\/div>`;\n  const hist = (l.historique || []).map(h => `<li><b>${esc(stLabel(h.statut))}<\/b><small>${fmtDT(h.created_at)}<\/small><\/li>`).join('');\n  const open = S.open.has(l.reference);\n  return `<article class=\"card st-${esc(l.statut)}\">\n    <div class=\"row\"><span class=\"ref\">${esc(t('ref'))} ${esc(l.reference)}<\/span><span class=\"badge\">${esc(stLabel(l.statut))}<\/span><\/div>\n    <p class=\"desc\">${esc(l.description)}<\/p>\n    ${l.photo ? `<a class=\"proof\" href=\"${esc(PREUVES + l.photo)}\" target=\"_blank\" rel=\"noopener\"><small>${esc(t('photo'))}<\/small><img src=\"${esc(PREUVES + l.photo)}\" alt=\"${esc(t('photo'))}\" loading=\"lazy\"><\/a>` : ''}\n    <div class=\"route\"><div><small>${esc(t('from'))}<\/small>${esc(l.depart)}<\/div><span class=\"dots\"><\/span><div style=\"text-align:right\"><small>${esc(t('to'))}<\/small>${esc(l.destination)}<\/div><\/div>\n    ${steps}\n    <div class=\"meta\">\n      ${l.date_prevue ? `<span>${esc(t('planned'))} <b>${fmtDate(l.date_prevue)}<\/b><\/span>` : ''}\n      ${l.prix != null ? `<span>${esc(t('price'))} <b>${fmtPrix(l.prix, l.devise)}<\/b><\/span>` : ''}\n    <\/div>\n    ${modeBlock(l)}\n    ${l.statut === 'livre' && l.preuve ? `<a class=\"proof\" href=\"${esc(PREUVES + l.preuve)}\" target=\"_blank\" rel=\"noopener\"><small>${esc(t('proof'))}<\/small><img src=\"${esc(PREUVES + l.preuve)}\" alt=\"${esc(t('proof'))}\" loading=\"lazy\"><\/a>` : ''}\n    ${hist ? `<button class=\"link\" data-a=\"hist\" data-ref=\"${esc(l.reference)}\">${esc(open ? t('hideHist') : t('history'))}<\/button>${open ? `<ul class=\"tl\">${hist}<\/ul>` : ''}` : ''}\n  <\/article>`;\n}\nfunction dashView() {\n  const L = S.data.livraisons || [];\n  const cur = L.filter(l => l.statut !== 'livre' && l.statut !== 'annule');\n  const done = L.filter(l => l.statut === 'livre' || l.statut === 'annule');\n  const upd = S.updatedAt ? `${t('updated')} ${S.updatedAt.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}` : '';\n  return `<header><div class=\"wrap\"><div class=\"brand\"><img src=\"${EMBLEM}\" alt=\"\"><b>Sahel AKD<\/b><\/div><div class=\"right\"><button class=\"bell\" data-a=\"panel-open\" aria-label=\"${esc(t('msgs'))}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z\"/><path d=\"M10 20a2 2 0 0 0 4 0\"/><\/svg>${nonLus() ? `<b>${nonLus()}<\/b>` : ''}<\/button>${langSwitch()}<\/div><\/div><\/header>\n  <main class=\"wrap\">\n    <div class=\"hello\"><h2>${esc(t('hello'))} <span>${esc(S.data.nom)}<\/span><\/h2><p>${esc(upd)}<\/p><\/div>\n    <div class=\"bar\"><button class=\"line-btn\" data-a=\"refresh\">${esc(t('refresh'))}<\/button><button class=\"line-btn\" data-a=\"logout\">${esc(t('logout'))}<\/button><\/div>\n    <div class=\"offline ${S.offline ? 'on' : ''}\">${esc(t('offline'))}<\/div>\n    ${L.length ? '' : `<div class=\"empty\">${esc(t('none'))}<\/div>`}\n    ${cur.length ? `<h3>${esc(t('current'))}<\/h3>${cur.map(livCard).join('')}` : ''}\n    ${done.length ? `<h3>${esc(t('done'))}<\/h3>${done.map(livCard).join('')}` : ''}\n    <footer>Sahel AKD<\/footer>\n  <\/main>`;\n}\nfunction render() {\n  document.documentElement.lang = S.lang === 'ha' ? 'ha' : 'fr';\n  const keepTel = $('#tel') ? $('#tel').value : null;\n  document.body.classList.toggle('plain', !S.data);\n  $('#app').innerHTML = S.data ? dashView() : loginView();\n  $('#panel').innerHTML = panelView();\n  badgeApp();\n  if (!S.data && keepTel != null) $('#tel').value = keepTel;\n}\n\n/* ---------- Logique ---------- */\nfunction logout(msg) {\n  stopPoll();\n  S.data = null; S.code = ''; S.open = new Set(); S.offline = false; S.msg = msg || '';\n  S.panel = false; S.known = new Set(); S.fresh = new Set();\n  store('del', KEY_SESSION);\n  render();\n}\nfunction startPoll() {\n  stopPoll();\n  timer = setInterval(() => { if (!document.hidden) refresh(true); }, 20000);\n}\nfunction stopPoll() { if (timer) { clearInterval(timer); timer = null; } }\n\nasync function refresh(silent) {\n  if (!S.data) return;\n  try {\n    const r = await rpc(S.tel, S.code);\n    if (!r.ok) { logout(r.erreur === 'bloque' ? t('blocked') : t('bad')); return; }\n    reperer(r, false);\n    S.data = r; S.offline = false; S.updatedAt = new Date();\n    if (S.panel) await marquerLus();\n    render();\n  } catch (e) {\n    S.offline = true; render();\n  }\n}\nasync function doLogin(tel, code, remember, auto) {\n  const btn = $('#go');\n  if (btn) btn.disabled = true;\n  try {\n    const r = await rpc(tel, code);\n    if (!r.ok) {\n      S.msg = r.erreur === 'bloque' ? t('blocked') : t('bad');\n      store('del', KEY_SESSION);\n      S.tel = tel; render(); return;\n    }\n    S.tel = tel; S.code = code; S.data = r; S.msg = ''; S.offline = false; S.updatedAt = new Date();\n    S.known = new Set(); reperer(r, true);\n    if (remember) store('set', KEY_SESSION, JSON.stringify({ tel, code }));\n    render(); startPoll();\n  } catch (e) {\n    if (!auto) { S.msg = t('net'); S.tel = tel; }\n    render();\n  }\n}\n\nasync function choisirMode(ref, mode) {\n  if (S.busy || !S.data) return;\n  S.busy = true; render();\n  try {\n    const r = await rpc(S.tel, S.code, 'sahel_client_choisir_mode', { p_reference: ref, p_mode: mode });\n    S.busy = false;\n    if (r.ok) {\n      S.data.livraisons = S.data.livraisons.map(l => l.reference === ref ? Object.assign({}, l, { mode_livraison: mode }) : l);\n      render(); toast(t('modeSaved'));\n    } else if (r.erreur === 'trop_tard') {\n      await refresh(true); toast(t('modeLate'), true);\n    } else if (r.erreur === 'bloque' || r.erreur === 'identifiants') {\n      logout(r.erreur === 'bloque' ? t('blocked') : t('bad'));\n    } else { render(); toast(t('net'), true); }\n  } catch (e) { S.busy = false; render(); toast(t('net'), true); }\n}\ndocument.addEventListener('submit', e => {\n  e.preventDefault();\n  const tel = normTel($('#tel').value);\n  const code = $('#code').value.trim();\n  if (!/^\\+?\\d{8,15}$/.test(tel)) { S.msg = t('badTel'); S.tel = $('#tel').value; render(); return; }\n  doLogin(tel, code, $('#rem').checked, false);\n});\ndocument.addEventListener('click', e => {\n  const el = e.target.closest('[data-a]');\n  if (!el) return;\n  const a = el.dataset.a;\n  if (a === 'lang') {\n    S.lang = el.dataset.v; store('set', KEY_LANG, S.lang);\n    const tel = $('#tel') ? $('#tel').value : S.tel;\n    S.tel = tel; if (!S.data) S.msg = '';\n    render();\n  }\n  else if (a === 'showcode') {\n    const tel = $('#tel').value, code = $('#code').value, rem = $('#rem').checked;\n    S.showCode = !S.showCode; S.tel = tel; render();\n    $('#code').value = code; $('#rem').checked = rem;\n  }\n  else if (a === 'mode') choisirMode(el.dataset.ref, el.dataset.v);\n  else if (a === 'panel-open') { S.panel = true; marquerLus().then(render); render(); }\n  else if (a === 'panel-close') { if (e.target === el || el.tagName === 'BUTTON') { S.panel = false; S.fresh = new Set(); render(); } }\n  else if (a === 'son') { S.son = !S.son; store('set', KEY_SON, S.son ? '1' : '0'); render(); if (S.son) sonner(); }\n  else if (a === 'alerts') { try { Notification.requestPermission().then(render, render); } catch (x) { render(); } }\n  else if (a === 'logout') logout('');\n  else if (a === 'refresh') refresh(false);\n  else if (a === 'hist') {\n    const r = el.dataset.ref;\n    if (S.open.has(r)) S.open.delete(r); else S.open.add(r);\n    render();\n  }\n});\ndocument.addEventListener('visibilitychange', () => { if (!document.hidden && S.data) refresh(true); });\n\nif ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && window.parent === window) {   // pas d'enregistrement quand le suivi est intégré à la boutique\n  window.addEventListener('load', () => { try { navigator.serviceWorker.register('sahel-suivi-sw.js').catch(() => {}); } catch (e) { /* sans gravité */ } });\n}\n(function init() {\n  const lg = store('get', KEY_LANG);\n  if (lg === 'fr' || lg === 'ha') S.lang = lg;\n  if (store('get', KEY_SON) === '0') S.son = false;\n  render();\n  const raw = store('get', KEY_SESSION);\n  if (raw) {\n    try {\n      const s = JSON.parse(raw);\n      if (s && s.tel && s.code) doLogin(s.tel, s.code, true, true);\n    } catch (e) { store('del', KEY_SESSION); }\n  }\n})();\n<\/script>\n<\/body>\n<\/html>\n";

async function get(path) {
  const r = await fetch(SB_URL + '/rest/v1/' + path, { headers: { apikey: SB_KEY } });
  if (!r.ok) { const e = new Error('http ' + r.status); e.http = true; throw e; }
  return r.json();
}

async function charger() {
  let boutique = null;
  try {
    const [p, c, b] = await Promise.all([
      get('sahel_produits?publie=eq.true&select=*&order=created_at.desc'),
      get('sahel_categories?select=*&order=ordre.asc'),
      get('sahel_boutique?id=eq.1&select=*')
    ]);
    boutique = b[0] || null;
    if (p.length) {
      S.produits = p; S.cats = c; S.boutique = boutique; S.demo = false; S.offline = false; S.error = false;
      store('set', KEY_CACHE, JSON.stringify({ p, c, b: S.boutique }));
    } else useDemo(boutique);   // boutique vide : exemples
  } catch (e) {
    const old = (() => { try { return JSON.parse(store('get', KEY_CACHE)); } catch (x) { return null; } })();
    if (old && old.p) { S.produits = old.p; S.cats = old.c || []; S.boutique = old.b || null; S.demo = false; S.offline = true; S.error = false; }
    else if (e && e.http) useDemo(null);   // base pas encore installée : exemples
    else S.error = true;
  }
  S.loaded = true;
  Object.keys(S.cart).forEach(id => { if (!S.produits.some(p => p.id === id)) delete S.cart[id]; });
  saveCart();
}
function saveCart() { store('set', KEY_CART, JSON.stringify(S.cart)); }
const prodById = id => S.produits.find(p => p.id === id);
const catById = id => S.cats.find(c => c.id === id);
const nbCart = () => Object.values(S.cart).reduce((a, b) => a + b, 0);
const totalCart = () => Object.entries(S.cart).reduce((a, [id, q]) => { const p = prodById(id); return a + (p ? p.prix * q : 0); }, 0);
const promoPct = p => p.ancien_prix ? Math.round((1 - p.prix / p.ancien_prix) * 100) : 0;
const promos = () => S.produits.filter(p => p.ancien_prix).sort((a, b) => promoPct(b) - promoPct(a));

/* ---------- Routes (le bouton retour du téléphone fonctionne) ---------- */
function route() {
  const h = (location.hash || '').replace(/^#\/?/, '');
  const [a, b] = h.split('/');
  if (a === 'p' && b) return { v: 'prod', id: decodeURIComponent(b) };
  if (a === 'cats') return { v: 'cats' };
  if (a === 'cart') return { v: 'cart' };
  if (a === 'suivi' || a === 'contact') return { v: 'suivi' };
  return { v: 'home' };
}
function go(h, replace) {
  if (replace) history.replaceState({ d: S.depth }, '', h);
  else { S.depth++; history.pushState({ d: S.depth }, '', h); }
  lastRoute = ''; render();
}
function goBack() { if (S.depth > 0) history.back(); else go('#/', true); }
window.addEventListener('popstate', e => { S.depth = (e.state && e.state.d) || 0; render(); });

/* ---------- Catégories / recherche ---------- */
function filtered() {
  const q = S.q.trim().toLowerCase();
  let l = S.produits.filter(p => (!S.cat || p.categorie_id === S.cat) && (!q || p.nom.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q)));
  if (S.sort === 'promo') l = l.filter(p => p.ancien_prix).sort((a, b) => promoPct(b) - promoPct(a));
  else if (S.sort === 'asc') l = l.slice().sort((a, b) => a.prix - b.prix);
  else if (S.sort === 'desc') l = l.slice().sort((a, b) => b.prix - a.prix);
  else if (S.sort === 'new') l = l.slice().sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
  else l = l.slice().sort((a, b) => (b.en_vedette ? 1 : 0) - (a.en_vedette ? 1 : 0));
  return l;
}
function resultsHtml() {
  const l = filtered();
  return (l.length ? `<div class="cnt">${esc(T[S.lang].count(l.length))}</div><div class="grid">${l.map(card).join('')}</div>` : `<div class="empty">${esc(t('noRes'))}</div>`);

let slideTimer;
let lastRoute = '';
function render() {
  document.documentElement.lang = S.lang;
  const r = route();
  const v = r.v === 'contact' ? 'suivi' : r.v;
  document.body.classList.toggle('pdp', v === 'prod');
  const sc = $('#sc'), same = lastRoute === v;
  const keep = same ? { y: sc.scrollTop, rail: ($('.rail') || {}).scrollTop, rp: ($('.rp') || {}).scrollTop } : null;
  let part;
  if (!S.loaded) part = { hd: header(false), body: `<div class="wrap"><div class="empty">…</div></div>` };
  else if (S.error) part = { hd: header(false), body: `<div class="wrap"><div class="empty">${esc(t('loadErr'))}<br><br><button class="lbtn" data-a="retry">${esc(t('retry'))}</button></div></div>` };
  else part = v === 'prod' ? prodView(r.id) : v === 'cart' ? cartView() : v === 'suivi' ? suiviView() : v === 'cats' ? catsView() : homeView();
  const n = nbCart();
  const navb = (id, ico, txt, badge) => `<button data-a="tab" data-v="${id}" class="${v === id ? 'on' : ''}">${ico}<span>${esc(txt)}</span>${badge ? `<i class="n">${badge}</i>` : ''}</button>`;
  const nav = `<nav><div class="wrap">${navb('home', I.home, t('home'))}${navb('cats', I.grid, t('cats'))}${navb('cart', I.cart, t('cart'), n)}${navb('suivi', I.truck, t('contact'))}</div></nav>`;
  $('#hd').innerHTML = part.hd;
  sc.className = part.cls || '';
  sc.innerHTML = (S.offline ? `<p class="note" style="text-align:center;margin:0;padding:6px;background:var(--s1)">${esc(t('offline'))}</p>` : '') + part.body;
  $('#bt').innerHTML = part.bt || nav;
  // l'écran de suivi reste chargé en arrière-plan : on change juste ce qu'on affiche
  const sv = $('#sv'), f = $('#svf');
  sv.classList.toggle('on', !!part.sv); sc.style.display = part.sv ? 'none' : '';
  if (part.sv && !f.getAttribute('srcdoc')) f.srcdoc = SUIVI_DOC;
  if (keep) { sc.scrollTop = keep.y; const rl = $('.rail'), rp = $('.rp'); if (rl && keep.rail) rl.scrollTop = keep.rail; if (rp && keep.rp) rp.scrollTop = keep.rp; }
  else sc.scrollTop = 0;
  lastRoute = v;
  startSlides();
}
function startSlides() {
  clearInterval(slideTimer);
  const el = $('#slides'); if (!el) return;
  const dots = [...document.querySelectorAll('#dots i')];
  el.addEventListener('scroll', () => { const i = Math.round(el.scrollLeft / el.clientWidth); dots.forEach((d, k) => d.classList.toggle('on', k === i)); }, { passive: true });
  if (dots.length < 2 || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  slideTimer = setInterval(() => {
    if (document.hidden || !document.body.contains(el)) return;
    const i = (Math.round(el.scrollLeft / el.clientWidth) + 1) % dots.length;
    el.scrollTo({ left: i * el.clientWidth, behavior: 'smooth' });
  }, 4500);
}

/* ---------- Commande WhatsApp ---------- */
function productLink(p) { return !p.demo && /^https?:/.test(location.protocol) ? location.href.split('#')[0] + '#/p/' + encodeURIComponent(p.id) : ''; }
function orderMessage() {
  const ids = Object.keys(S.cart).filter(id => prodById(id));
  const L = ids.map(id => { const p = prodById(id), q = S.cart[id]; return `• ${q} × ${p.nom} — ${fmt(p.prix * q, p.devise)}`; });
  const parts = [t('hello'), ...L, '', `${t('total')} : ${fmt(totalCart(), 'FCFA')}`];
  if (S.nom.trim()) parts.push(`${t('name')} : ${S.nom.trim()}`);
  if (S.lieu.trim()) parts.push(`${t('place')} : ${S.lieu.trim()}`);
  parts.push(`${t('mode')} : ${S.mode === 'livreur' ? t('delivery') : t('pickup')}`);
  return parts.join('\n');
}
function openWa(text) {
  const n = waNum();
  if (!n && S.demo) { window.open('https://wa.me/' + (text ? '?text=' + encodeURIComponent(text) : ''), '_blank'); return; }
  if (!n) return toast(t('noWa'), true);
  window.open('https://wa.me/' + n + (text ? '?text=' + encodeURIComponent(text) : ''), '_blank');
}
function majBadge() {
  const n = nbCart(), b = document.querySelector('nav button[data-v=cart]'); if (!b) return;
  let i = b.querySelector('.n'); if (!n) { if (i) i.remove(); return; }
  if (!i) { i = document.createElement('i'); i.className = 'n'; b.appendChild(i); }
  i.textContent = n;
}
function addToCart(id, q) { const p = prodById(id); if (!p || !p.en_stock) return false; S.cart[id] = Math.min(99, (S.cart[id] || 0) + q); saveCart(); return true; }

/* ---------- Événements ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  if (a === 'lang') { S.lang = S.lang === 'fr' ? 'ha' : 'fr'; store('set', KEY_LANG, S.lang); render(); }
  else if (a === 'tab') { const v = el.dataset.v; go(v === 'home' ? '#/' : '#/' + v, true); }
  else if (a === 'home') go('#/', true);
  else if (a === 'back') goBack();
  else if (a === 'catpage') { S.cat = id || null; S.sort = 'rel'; S.q = ''; go('#/cats'); }
  else if (a === 'deals') { S.cat = null; S.q = ''; S.sort = 'promo'; go('#/cats'); }
  else if (a === 'fresh') { S.cat = null; S.q = ''; S.sort = 'new'; go('#/cats'); }
  else if (a === 'railcat') { S.cat = id || null; render(); const rp = $('.rp'); if (rp) rp.scrollTop = 0; }
  else if (a === 'sort') { S.sort = el.dataset.v; render(); }
  else if (a === 'searchgo') { const i = $('#q'); S.q = i ? i.value : S.q; S.cat = null; S.sort = 'rel'; if (route().v !== 'cats') go('#/cats'); else render(); }
  else if (a === 'open') { S.qty = 1; go('#/p/' + encodeURIComponent(id)); }
  else if (a === 'quick') { if (addToCart(id, 1)) { majBadge(); toast(t('added')); } }
  else if (a === 'q-' || a === 'q+') { S.qty = Math.max(1, Math.min(99, S.qty + (a === 'q+' ? 1 : -1))); $('#qv').textContent = S.qty; }
  else if (a === 'add') { if (addToCart(id, S.qty)) { S.qty = 1; render(); toast(t('added')); } }
  else if (a === 'buy') { if (addToCart(id, S.qty)) { S.qty = 1; go('#/cart'); } }
  else if (a === 'share') {
    const p = prodById(route().id); if (!p) return;
    const url = productLink(p) || location.href;
    try { if (navigator.share) { await navigator.share({ title: p.nom, text: p.nom + ' — ' + fmt(p.prix, p.devise), url }); return; } } catch (x) { if (x && x.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url); toast(t('shared')); } catch (x) { toast(url); }
  }
  else if (a === 'plus') { S.cart[id] = Math.min(99, (S.cart[id] || 0) + 1); saveCart(); render(); }
  else if (a === 'minus') { if ((S.cart[id] || 0) <= 1) delete S.cart[id]; else S.cart[id]--; saveCart(); render(); }
  else if (a === 'rm') { delete S.cart[id]; saveCart(); render(); }
  else if (a === 'clear') { S.cart = {}; saveCart(); render(); }
  else if (a === 'mode') { S.mode = el.dataset.v; render(); }
  else if (a === 'order') openWa(orderMessage());
  else if (a === 'wa') openWa('');
  else if (a === 'retry') { S.loaded = false; render(); await charger(); render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'q') { e.preventDefault(); const b = $('.search .go'); if (b) b.click(); }
  else if (e.key === 'Enter' && e.target.matches && e.target.matches('.p[data-a=open]')) e.target.click();
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'q') {
    S.q = e.target.value;
    if (route().v === 'cats') { const r = $('#res'); if (r) r.innerHTML = resultsHtml(); }
  } else if (id === 'nom') S.nom = e.target.value;
  else if (id === 'lieu') S.lieu = e.target.value;
});

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { try { navigator.serviceWorker.register('sahel-market-sw.js').catch(() => {}); } catch (e) { /* sans gravité */ } });
}
(async function init() {
  const lg = store('get', KEY_LANG);
  if (lg === 'fr' || lg === 'ha') S.lang = lg;
  try { S.cart = JSON.parse(store('get', KEY_CART)) || {}; } catch (e) { S.cart = {}; }
  S.depth = (history.state && history.state.d) || 0;
  history.replaceState({ d: S.depth }, '', location.href);
  render();
  await charger();
  render();
  setInterval(async () => {
    const r = route().v, ae = document.activeElement;
    if (document.hidden || r === 'cart' || (ae && /INPUT|TEXTAREA/.test(ae.tagName))) return;
    const avant = JSON.stringify(S.produits); await charger();
    if (JSON.stringify(S.produits) !== avant) render();
  }, 60000);
})();
</script>
