<style>
:root{
  --nuit:#06050b;--s1:#0f0d13;--s2:#17141c;--line:#2a2531;
  --or:#d4a937;--or2:#f1d27a;--or3:#8a6a1f;--ivoire:#f3ecdd;--sable:#a9a08f;--bad:#e8675f;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--nuit);color:var(--ivoire);font-family:var(--sans);font-size:16px;line-height:1.4}
body{min-height:100vh;background:radial-gradient(120% 50% at 50% -8%,rgba(212,169,55,.11),transparent 62%),var(--nuit);background-repeat:no-repeat}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--or2);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

.st-enregistre{--st:#8d8799}.st-pris_en_charge{--st:#6fa8e8}.st-en_transit{--st:#f1d27a}
.st-en_livraison{--st:#f0a24a}.st-livre{--st:#52c48f}.st-annule{--st:#e8675f}

.btn{width:100%;border:0;border-radius:12px;padding:14px 16px;font-weight:700;background:linear-gradient(135deg,#f6dc8e,#cfa032);color:#1a1405;box-shadow:0 1px 0 rgba(255,255,255,.35) inset}
.btn:disabled{opacity:.6}
.line-btn{background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:14px;color:var(--ivoire)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:6px 13px;color:var(--sable);font-size:13px}
.lang button.on{background:var(--or);color:#1a1405;font-weight:700}

/* connexion */
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:20px 20px 28px;max-width:400px;margin:0 auto}
.auth .top{display:flex;justify-content:flex-end}
.logo-big{display:block;width:min(70vw,270px);height:auto;margin:0 auto 6px;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 3%,#000 97%,transparent),linear-gradient(to bottom,transparent,#000 3%,#000 97%,transparent);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 3%,#000 97%,transparent),linear-gradient(to bottom,transparent,#000 3%,#000 97%,transparent);mask-composite:intersect}
.auth h1{margin:0;text-align:center;font:600 24px var(--serif);color:var(--or2)}
.auth .sub{text-align:center;color:var(--sable);margin:4px 0 22px;font-size:15px}
label{display:block;font-size:13px;color:var(--sable);margin:14px 0 6px}
input[type=text],input[type=tel],input[type=password]{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:14px;outline:none;font-size:17px}
input:focus{border-color:var(--or);box-shadow:0 0 0 3px rgba(212,169,55,.16)}
.codewrap{position:relative}
.codewrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--or2);padding:10px;font-size:14px}
.codewrap input{padding-right:88px}
.check{display:flex;align-items:center;gap:10px;margin:16px 0 4px;color:var(--sable);font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--or)}
.err{display:none;margin-top:14px;color:var(--bad);font-size:14px;text-align:center}
.err.on{display:block}
.auth .btn{margin-top:18px}

/* tableau */
header{position:sticky;top:0;z-index:5;background:rgba(6,5,11,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:38px;width:auto;display:block}
.brand b{font:600 19px var(--serif);color:var(--or2)}
.hello{padding:14px 0 2px}
.hello h2{margin:0;font:600 24px var(--serif)}
.hello h2 span{color:var(--or2)}
.hello p{margin:4px 0 0;color:var(--sable);font-size:13px}
.bar{display:flex;gap:8px;margin:14px 0 4px}
h3{font:600 18px var(--serif);margin:20px 0 8px}
.card{background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--st,var(--line));border-radius:10px;padding:11px 12px;margin-bottom:9px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ref{font:600 16px var(--serif);letter-spacing:.02em}
.badge{font-size:12px;color:var(--st);border:1px solid var(--st);border-radius:999px;padding:2px 9px;white-space:nowrap}
.desc{margin:6px 0 2px;font-size:15px}
.route{display:flex;align-items:center;gap:8px;margin:8px 0 2px;font-size:15px}
.route small{display:block;color:var(--sable);font-size:11.5px}
.route .dots{flex:1;border-top:2px dotted var(--or3);position:relative;min-width:20px;height:0}
.route .dots:after{content:"";position:absolute;right:0;top:-5px;width:8px;height:8px;border-right:2px solid var(--or);border-top:2px solid var(--or);transform:rotate(45deg)}
.steps{display:flex;gap:4px;margin:10px 0 4px}
.steps i{flex:1;height:5px;border-radius:3px;background:#2a2630}
.steps i.on{background:var(--st)}
.meta{color:var(--sable);font-size:12.5px;display:flex;flex-wrap:wrap;gap:0 14px;margin-top:4px}
.meta b{color:var(--ivoire);font-weight:600}
.link{background:none;border:0;color:var(--or2);padding:8px 0 0;font-size:13.5px}
.tl{list-style:none;margin:14px 0 2px;padding:0 0 0 16px;border-left:2px solid var(--or3)}
.tl li{position:relative;padding:0 0 14px 14px}
.tl li:before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--or)}
.tl li:last-child{padding-bottom:2px}
.tl small{display:block;color:var(--sable)}
.empty{color:var(--sable);text-align:center;padding:34px 12px;border:1px dashed var(--line);border-radius:12px;margin-top:14px}
.offline{display:none;background:#241a10;border:1px solid #7a3f18;color:#ffb27a;border-radius:10px;padding:8px 12px;font-size:13px;margin-top:12px}
.offline.on{display:block}
footer{color:var(--sable);font-size:12px;text-align:center;padding:26px 0 calc(26px + env(safe-area-inset-bottom))}
.choice{margin-top:8px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:var(--s2)}
.choice.todo{border-color:var(--or)}
.choice p{margin:0 0 7px;font-size:13.5px;color:var(--ivoire)}
.choice .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line);background:var(--s1);border-radius:10px;padding:8px 6px;color:var(--ivoire);font-size:13.5px;line-height:1.25;cursor:pointer}
.opt.on{border-color:var(--or);background:rgba(212,169,55,.14);color:var(--or2);font-weight:600}
.opt:disabled{opacity:.6}
.chosen{margin:6px 0 0;font-size:13.5px;color:var(--or2)}
a.proof{display:block;margin-top:8px;text-decoration:none;color:var(--sable)}
a.proof small{display:block;color:var(--sable);font-size:11.5px;margin-bottom:4px;text-decoration:none}
.proof img{display:block;width:auto;max-width:100%;max-height:130px;object-fit:contain;border-radius:10px;border:1px solid var(--line);background:var(--s2)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;background:#211d28;border:1px solid var(--or);color:var(--ivoire);padding:10px 16px;border-radius:12px;max-width:90%;display:none;font-size:14px}
#toast.err{border-color:var(--bad)}
header .right{display:flex;align-items:center;gap:10px}
.bell{position:relative;background:none;border:1px solid var(--line);border-radius:999px;width:38px;height:38px;color:var(--or2);display:grid;place-items:center;padding:0}
.bell svg{width:19px;height:19px}
.bell b{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.backdrop{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:84vh;overflow:auto;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 10px;font:600 20px var(--serif);color:var(--or2)}
.sheet .line-btn{width:100%;margin-top:10px}
.msgs{list-style:none;margin:0;padding:0}
.msgs li{border:1px solid var(--line);border-left:3px solid var(--st,var(--or3));border-radius:10px;background:var(--s2);padding:8px 11px;margin-bottom:6px}
.msgs li.new{border-color:var(--or);border-left-color:var(--st,var(--or))}
.msgs p{margin:0;font-size:14.5px}
.msgs small{display:block;margin-top:2px;color:var(--sable);font-size:12px}
.msgs .from{color:var(--or2);font-size:12px;font-weight:600;margin:0 0 2px}
.sonbtn{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 10px;text-align:left}
.sonbtn i{width:34px;height:20px;border-radius:10px;background:#2a2630;position:relative;flex:none;transition:background .15s}
.sonbtn i:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--sable);transition:transform .15s,background .15s}
.sonbtn.on i{background:var(--or3)}
.sonbtn.on i:after{transform:translateX(14px);background:var(--or2)}
.alerts{margin:0 0 10px;font-size:13px;color:var(--sable)}
.alerts .line-btn{margin-top:6px}
body.plain{background:var(--nuit)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function store(op, key, val) {
  try {
    if (op === 'get') return localStorage.getItem(key);
    if (op === 'set') localStorage.setItem(key, val);
    if (op === 'del') localStorage.removeItem(key);
  } catch (e) { /* stockage indisponible : l'appli marche sans */ }
  return null;
}
function normTel(s) {
  let x = String(s || '').replace(/[\s\-.()]/g, '');
  if (x.startsWith('00')) x = '+' + x.slice(2);
  if (!x.startsWith('+') && /^\d{8}$/.test(x)) x = '+227' + x;
  return x;
}

async function rpc(tel, code, fn, extra) {
  const r = await fetch(SB_URL + '/rest/v1/rpc/' + (fn || 'sahel_client_suivi'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SB_KEY },
    body: JSON.stringify(Object.assign({ p_tel: tel, p_code: code }, extra || {}))
  });
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}

let audioCtx = null;
function debloquerAudio() {
  try {
    if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { /* sans gravité */ }
}
// Les navigateurs n'autorisent le son qu'après un premier appui de la personne
document.addEventListener('pointerdown', debloquerAudio, { passive: true });
function sonner() {
  if (!S.son) return;
  debloquerAudio();
  const c = audioCtx;
  if (!c || c.state !== 'running') return;
  try {
    [[880, 0], [1318.5, 0.16]].forEach(([f, d]) => {
      const o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + d;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.28, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + 0.6);
    });
  } catch (e) { /* sans gravité */ }
  try { if (navigator.vibrate) navigator.vibrate([120, 60, 120]); } catch (e) { /* sans gravité */ }
}

  const n = nonLus();
  try { document.title = (n ? '(' + n + ') ' : '') + 'Sahel AKD Suivi'; } catch (e) { /* sans gravité */ }
  try { if (navigator.setAppBadge) { n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } } catch (e) { /* sans gravité */ }
}
async function alerte(m) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const opts = { body: msgText(m), icon: 'sahel-icon-192.png', badge: 'sahel-icon-192.png', tag: 'sahel-' + m.id, vibrate: [120, 60, 120], silent: false };
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg && reg.showNotification) { await reg.showNotification('Sahel AKD', opts); return; }
  } catch (e) { /* on essaie la méthode simple */ }
  try { new Notification('Sahel AKD', opts); } catch (e) { /* sans gravité */ }
}
function reperer(r, premier) {
  const nouveaux = (r.messages || []).filter(m => !m.lu && !S.known.has(m.id));
  (r.messages || []).forEach(m => S.known.add(m.id));
  if (premier || !nouveaux.length) return;
  toast(t('newMsg') + ' : ' + msgText(nouveaux[0]));
  sonner();
  nouveaux.slice(0, 3).forEach(alerte);
}
async function marquerLus() {
  if (!S.data || !S.data.messages) return;
  S.fresh = new Set(S.data.messages.filter(m => !m.lu).map(m => m.id));
  if (!S.fresh.size) return;
  S.data.messages = S.data.messages.map(m => Object.assign({}, m, { lu: true }));
  try { await rpc(S.tel, S.code, 'sahel_client_lire_messages'); } catch (e) { /* sera refait à la prochaine ouverture */ }
}
function panelView() {
  if (!S.panel || !S.data) return '';
  const L = S.data.messages || [];
  const perm = 'Notification' in window ? Notification.permission : 'unsupported';
  const alertes = perm === 'default' ? `<div class="alerts">${esc(t('alertsHint'))}<button class="line-btn" data-a="alerts">${esc(t('alertsAsk'))}</button></div>`
    : perm === 'granted' ? `<p class="alerts">${esc(t('alertsOn'))}</p>` : '';
  const items = L.map(m => `<li class="${m.type === 'statut' ? 'st-' + esc(m.statut) : ''} ${S.fresh.has(m.id) ? 'new' : ''}"><p class="from">${esc(t('fromSahel'))}</p><p>${esc(msgText(m))}</p><small>${fmtDT(m.created_at)}</small></li>`).join('');
  return `<div class="backdrop" data-a="panel-close"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(t('msgs'))}">
    <h3>${esc(t('msgs'))}</h3>
    <button class="line-btn sonbtn ${S.son ? 'on' : ''}" data-a="son" role="switch" aria-checked="${S.son}"><i></i>${esc(S.son ? t('sonOn') : t('sonOff'))}</button>${alertes}
    ${L.length ? `<ul class="msgs">${items}</ul>` : `<div class="empty">${esc(t('noMsg'))}</div>`}
    <button class="line-btn" data-a="panel-close">${esc(t('close'))}</button></div></div>`;
}
function modeBlock(l) {
  if (EARLY.includes(l.statut)) {
    const m = l.mode_livraison;
    return `<div class="choice ${m ? '' : 'todo'}"><p>${m ? '' : `<b>${esc(t('modeToChoose'))}</b>`}${esc(t('modeQ'))}</p>
      <div class="opts">
        <button class="opt ${m === 'livreur' ? 'on' : ''}" data-a="mode" data-ref="${esc(l.reference)}" data-v="livreur" aria-pressed="${m === 'livreur'}" ${S.busy ? 'disabled' : ''}>${esc(t('modeLivreur'))}</button>
        <button class="opt ${m === 'retrait' ? 'on' : ''}" data-a="mode" data-ref="${esc(l.reference)}" data-v="retrait" aria-pressed="${m === 'retrait'}" ${S.busy ? 'disabled' : ''}>${esc(t('modeRetrait'))}</button>
      </div></div>`;
  }
  if (l.statut !== 'annule' && l.mode_livraison) {
    return `<p class="chosen">${esc(t(l.mode_livraison === 'livreur' ? 'modeChosenLivreur' : 'modeChosenRetrait'))}</p>`;
  }
  return '';
}
function livCard(l) {
  const annule = l.statut === 'annule';
  const idx = STEPS.indexOf(l.statut);
  const steps = annule ? '' : `<div class="steps" aria-hidden="true">${STEPS.map((_, i) => `<i class="${i <= idx ? 'on' : ''}"></i>`).join('')}</div>`;
  const hist = (l.historique || []).map(h => `<li><b>${esc(stLabel(h.statut))}</b><small>${fmtDT(h.created_at)}</small></li>`).join('');
  const open = S.open.has(l.reference);
  return `<article class="card st-${esc(l.statut)}">
    <div class="row"><span class="ref">${esc(t('ref'))} ${esc(l.reference)}</span><span class="badge">${esc(stLabel(l.statut))}</span></div>
    <p class="desc">${esc(l.description)}</p>
    ${l.photo ? `<a class="proof" href="${esc(PREUVES + l.photo)}" target="_blank" rel="noopener"><small>${esc(t('photo'))}</small><img src="${esc(PREUVES + l.photo)}" alt="${esc(t('photo'))}" loading="lazy"></a>` : ''}
    <div class="route"><div><small>${esc(t('from'))}</small>${esc(l.depart)}</div><span class="dots"></span><div style="text-align:right"><small>${esc(t('to'))}</small>${esc(l.destination)}</div></div>
    ${steps}
    <div class="meta">
      ${l.date_prevue ? `<span>${esc(t('planned'))} <b>${fmtDate(l.date_prevue)}</b></span>` : ''}
      ${l.prix != null ? `<span>${esc(t('price'))} <b>${fmtPrix(l.prix, l.devise)}</b></span>` : ''}
    </div>
    ${modeBlock(l)}
    ${l.statut === 'livre' && l.preuve ? `<a class="proof" href="${esc(PREUVES + l.preuve)}" target="_blank" rel="noopener"><small>${esc(t('proof'))}</small><img src="${esc(PREUVES + l.preuve)}" alt="${esc(t('proof'))}" loading="lazy"></a>` : ''}
    ${hist ? `<button class="link" data-a="hist" data-ref="${esc(l.reference)}">${esc(open ? t('hideHist') : t('history'))}</button>${open ? `<ul class="tl">${hist}</ul>` : ''}` : ''}
  </article>`;
}
function dashView() {
  const L = S.data.livraisons || [];
  const cur = L.filter(l => l.statut !== 'livre' && l.statut !== 'annule');
  const done = L.filter(l => l.statut === 'livre' || l.statut === 'annule');
  const upd = S.updatedAt ? `${t('updated')} ${S.updatedAt.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}` : '';
  return `<header><div class="wrap"><div class="brand"><img src="${EMBLEM}" alt=""><b>Sahel AKD</b></div><div class="right"><button class="bell" data-a="panel-open" aria-label="${esc(t('msgs'))}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>${nonLus() ? `<b>${nonLus()}</b>` : ''}</button>${langSwitch()}</div></div></header>
  <main class="wrap">
    <div class="hello"><h2>${esc(t('hello'))} <span>${esc(S.data.nom)}</span></h2><p>${esc(upd)}</p></div>
    <div class="bar"><button class="line-btn" data-a="refresh">${esc(t('refresh'))}</button><button class="line-btn" data-a="logout">${esc(t('logout'))}</button></div>
    <div class="offline ${S.offline ? 'on' : ''}">${esc(t('offline'))}</div>
    ${L.length ? '' : `<div class="empty">${esc(t('none'))}</div>`}
    ${cur.length ? `<h3>${esc(t('current'))}</h3>${cur.map(livCard).join('')}` : ''}
    ${done.length ? `<h3>${esc(t('done'))}</h3>${done.map(livCard).join('')}` : ''}
    <footer>Sahel AKD</footer>
  </main>`;
}
function render() {
  document.documentElement.lang = S.lang === 'ha' ? 'ha' : 'fr';
  const keepTel = $('#tel') ? $('#tel').value : null;
  document.body.classList.toggle('plain', !S.data);
  $('#app').innerHTML = S.data ? dashView() : loginView();
  $('#panel').innerHTML = panelView();
  badgeApp();
  if (!S.data && keepTel != null) $('#tel').value = keepTel;
}

/* ---------- Logique ---------- */
function logout(msg) {
  stopPoll();
  S.data = null; S.code = ''; S.open = new Set(); S.offline = false; S.msg = msg || '';
  S.panel = false; S.known = new Set(); S.fresh = new Set();
  store('del', KEY_SESSION);
  render();
}
function startPoll() {
  stopPoll();
  timer = setInterval(() => { if (!document.hidden) refresh(true); }, 20000);
}
function stopPoll() { if (timer) { clearInterval(timer); timer = null; } }

async function refresh(silent) {
  if (!S.data) return;
  try {
    const r = await rpc(S.tel, S.code);
    if (!r.ok) { logout(r.erreur === 'bloque' ? t('blocked') : t('bad')); return; }
    reperer(r, false);
    S.data = r; S.offline = false; S.updatedAt = new Date();
    if (S.panel) await marquerLus();
    render();
  } catch (e) {
    S.offline = true; render();
  }
}
async function doLogin(tel, code, remember, auto) {
  const btn = $('#go');
  if (btn) btn.disabled = true;
  try {
    const r = await rpc(tel, code);
    if (!r.ok) {
      S.msg = r.erreur === 'bloque' ? t('blocked') : t('bad');
      store('del', KEY_SESSION);
      S.tel = tel; render(); return;
    }
    S.tel = tel; S.code = code; S.data = r; S.msg = ''; S.offline = false; S.updatedAt = new Date();
    S.known = new Set(); reperer(r, true);
    if (remember) store('set', KEY_SESSION, JSON.stringify({ tel, code }));
    render(); startPoll();
  } catch (e) {
    if (!auto) { S.msg = t('net'); S.tel = tel; }
    render();
  }
}

async function choisirMode(ref, mode) {
  if (S.busy || !S.data) return;
  S.busy = true; render();
  try {
    const r = await rpc(S.tel, S.code, 'sahel_client_choisir_mode', { p_reference: ref, p_mode: mode });
    S.busy = false;
    if (r.ok) {
      S.data.livraisons = S.data.livraisons.map(l => l.reference === ref ? Object.assign({}, l, { mode_livraison: mode }) : l);
      render(); toast(t('modeSaved'));
    } else if (r.erreur === 'trop_tard') {
      await refresh(true); toast(t('modeLate'), true);
    } else if (r.erreur === 'bloque' || r.erreur === 'identifiants') {
      logout(r.erreur === 'bloque' ? t('blocked') : t('bad'));
    } else { render(); toast(t('net'), true); }
  } catch (e) { S.busy = false; render(); toast(t('net'), true); }
}
document.addEventListener('submit', e => {
  e.preventDefault();
  const tel = normTel($('#tel').value);
  const code = $('#code').value.trim();
  if (!/^\+?\d{8,15}$/.test(tel)) { S.msg = t('badTel'); S.tel = $('#tel').value; render(); return; }
  doLogin(tel, code, $('#rem').checked, false);
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a;
  if (a === 'lang') {
    S.lang = el.dataset.v; store('set', KEY_LANG, S.lang);
    const tel = $('#tel') ? $('#tel').value : S.tel;
    S.tel = tel; if (!S.data) S.msg = '';
    render();
  }
  else if (a === 'showcode') {
    const tel = $('#tel').value, code = $('#code').value, rem = $('#rem').checked;
    S.showCode = !S.showCode; S.tel = tel; render();
    $('#code').value = code; $('#rem').checked = rem;
  }
  else if (a === 'mode') choisirMode(el.dataset.ref, el.dataset.v);
  else if (a === 'panel-open') { S.panel = true; marquerLus().then(render); render(); }
  else if (a === 'panel-close') { if (e.target === el || el.tagName === 'BUTTON') { S.panel = false; S.fresh = new Set(); render(); } }
  else if (a === 'son') { S.son = !S.son; store('set', KEY_SON, S.son ? '1' : '0'); render(); if (S.son) sonner(); }
  else if (a === 'alerts') { try { Notification.requestPermission().then(render, render); } catch (x) { render(); } }
  else if (a === 'logout') logout('');
  else if (a === 'refresh') refresh(false);
  else if (a === 'hist') {
    const r = el.dataset.ref;
    if (S.open.has(r)) S.open.delete(r); else S.open.add(r);
    render();
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.data) refresh(true); });

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { try { navigator.serviceWorker.register('sahel-suivi-sw.js').catch(() => {}); } catch (e) { /* sans gravité */ } });
}
(function init() {
  const lg = store('get', KEY_LANG);
  if (lg === 'fr' || lg === 'ha') S.lang = lg;
  if (store('get', KEY_SON) === '0') S.son = false;
  render();
  const raw = store('get', KEY_SESSION);
  if (raw) {
    try {
      const s = JSON.parse(raw);
      if (s && s.tel && s.code) doLogin(s.tel, s.code, true, true);
    } catch (e) { store('del', KEY_SESSION); }
  }
})();
</script>
</body>
</html>
